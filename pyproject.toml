[build-system]
requires = [
    "setuptools>=75.3.4,<76; python_version == '3.8'",
    "setuptools>=77.0.3; python_version >= '3.9'",
]
build-backend = "setuptools.build_meta"

[project]
name = "motmetrics"
version = "1.4.0"
description = "Metrics for multiple object tracker benchmarking."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8,<3.15"
license = { file = "LICENSE" }
authors = [
    { name = "Christoph Heindl" },
    { name = "Jack Valmadre" },
    { name = "Mikel Broström" },
]
keywords = ["tracker", "MOT", "evaluation", "metrics", "compare"]
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy>=1.23.2",
    "pandas>=1.5.0",
    "scipy>=1.9.3",
]

[dependency-groups]
dev = [
    "numpy>=1.23.2",
    "pandas>=1.5.0",
    "scipy>=1.9.3",
    "ruff>=0.12.0",
    "pytest>=7.4.4,<8.4.0; python_version < '3.9'",
    "pytest>=8.4.1; python_version >= '3.9'",
    "pytest-benchmark>=4.0.0,<5.0.0; python_version < '3.9'",
    "pytest-benchmark>=5.1.0; python_version >= '3.9'",
]

[project.urls]
Homepage = "https://github.com/cheind/py-motmetrics"
Issues = "https://github.com/cheind/py-motmetrics/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["motmetrics"]

[tool.ruff]
line-length = 127

[tool.ruff.lint]
select = ["C90", "E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["motmetrics"]
